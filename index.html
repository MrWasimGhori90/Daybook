<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d6e8c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daybook">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Daybook</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column with a bottom tab bar. Each section has its own colour: Tasks teal, Daily amber, Monthly violet, Challenges green. */
:root {
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px);
  --bg: #f2f5f8;
  --surface: #ffffff;
  --fg: #14202b;
  --muted: #5f6f7e;
  --line: #d9e1e8;
  --accent: #1d6e8c;  --accent-ink: #ffffff;  --accent-soft: #dcebf1;
  --goal: #a85f10;    --goal-ink: #ffffff;    --goal-soft: #f6e7d2;
  --month: #5b4aa8;   --month-ink: #ffffff;   --month-soft: #e8e4f6;
  --chal: #1f7a4c;    --chal-ink: #ffffff;    --chal-soft: #dcf0e5;
  --done: #8896a3;
  --danger: #b3362f;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f161c; --surface: #17212a; --fg: #e8eef3; --muted: #93a3b1; --line: #263543;
    --accent: #5fb4d1; --accent-ink: #0b1a22; --accent-soft: #16303b;
    --goal: #e8a653;   --goal-ink: #1f1405;   --goal-soft: #3a2c16;
    --month: #a99be6;  --month-ink: #17132b;  --month-soft: #2a2442;
    --chal: #62c28f;   --chal-ink: #0b2016;   --chal-soft: #17352a;
    --done: #6b7b89; --danger: #ef7a72; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f161c; --surface: #17212a; --fg: #e8eef3; --muted: #93a3b1; --line: #263543;
  --accent: #5fb4d1; --accent-ink: #0b1a22; --accent-soft: #16303b;
  --goal: #e8a653;   --goal-ink: #1f1405;   --goal-soft: #3a2c16;
  --month: #a99be6;  --month-ink: #17132b;  --month-soft: #2a2442;
  --chal: #62c28f;   --chal-ink: #0b2016;   --chal-soft: #17352a;
  --done: #6b7b89; --danger: #ef7a72; color-scheme: dark;
}
body { margin: 0; }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-top: 20px;
  padding-bottom: calc(92px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); opacity: 0; }

/* Section colours */
.panel { display: none; flex-direction: column; gap: 14px; --sec: var(--accent); --sec-ink: var(--accent-ink); --sec-soft: var(--accent-soft); }
.panel.on { display: flex; }
.sec-daily { --sec: var(--goal); --sec-ink: var(--goal-ink); --sec-soft: var(--goal-soft); }
.sec-monthly { --sec: var(--month); --sec-ink: var(--month-ink); --sec-soft: var(--month-soft); }
.sec-challenges { --sec: var(--chal); --sec-ink: var(--chal-ink); --sec-soft: var(--chal-soft); }

/* Masthead (Tasks and Daily) */
.masthead { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 6px; }
.masthead .when { min-width: 0; }
.greet { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); margin-bottom: 8px; overflow-wrap: anywhere; }
.weekday { font-family: var(--font-display); font-weight: 700; font-size: 2.4rem; line-height: 1; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.fulldate { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); margin-top: 8px; letter-spacing: 0.02em; }
.ring { position: relative; width: 84px; height: 84px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { stroke: var(--line); }
.ring .arc { stroke: var(--goal); transition: stroke-dashoffset 0.4s ease; }
.ring .label { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-family: var(--font-mono); font-size: 0.95rem; font-weight: 500; line-height: 1.1; }
.ring .label small { display: block; font-size: 0.62rem; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; }

/* Section heading (Monthly, Challenges, Profile) */
.sechead { padding-top: 6px; display: flex; flex-direction: column; gap: 6px; }
.sectitle { font-family: var(--font-display); font-weight: 700; font-size: 2rem; line-height: 1.05; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: 0.92rem; max-width: 46ch; }
.h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; margin: 6px 0 0; letter-spacing: -0.01em; }
.meta { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); }

/* Forms and buttons */
.add { display: flex; gap: 8px; }
.add.stack { flex-direction: column; }
.add-row { display: flex; gap: 8px; align-items: stretch; }
input[type="text"], input[type="number"], select {
  min-width: 0; padding: 13px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
}
.add input[type="text"] { flex: 1; }
input::placeholder { color: var(--muted); }
.add button[type="submit"], .cta {
  border: 0; background: var(--sec); color: var(--sec-ink); font-weight: 600; padding: 0 18px; border-radius: 12px; min-height: 48px;
}
.target { flex: 1; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 0.9rem; }
.target input { width: 84px; font-family: var(--font-mono); }
.add select { flex: 1; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); background: var(--surface);
  border-radius: 12px; padding: 11px 16px; font-weight: 600; min-height: 46px; cursor: pointer;
}
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); border-color: var(--danger); color: var(--surface); }

.note { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 0.85rem; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 10px 12px; }
.note button { border: 0; background: transparent; color: var(--accent); font-weight: 600; padding: 4px; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 12px; font-size: 0.85rem; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* Tasks */
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.stackv { display: flex; flex-direction: column; gap: 10px; }
.item { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px 6px 6px 8px; }
.check { width: 44px; height: 44px; flex: none; border: 0; background: transparent; display: grid; place-items: center; }
.check span { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--muted); display: grid; place-items: center; transition: background 0.15s, border-color 0.15s; }
.check span svg { width: 14px; height: 14px; opacity: 0; stroke: var(--sec-ink); }
.item.done .check span, .goal.done .check span { background: var(--sec); border-color: var(--sec); }
.item.done .check span svg, .goal.done .check span svg { opacity: 1; }
.item .title { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.item.done .title { color: var(--done); text-decoration: line-through; text-decoration-thickness: 1px; }
.del { border: 0; background: transparent; color: var(--muted); width: 44px; height: 44px; border-radius: 10px; font-size: 1.3rem; line-height: 1; flex: none; }
.del:hover, .del.armed { color: var(--danger); }
.del.armed { font-size: 0.8rem; font-weight: 600; width: auto; padding: 0 10px; }

/* Daily goals */
.goal { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 8px 12px 8px; display: flex; flex-direction: column; gap: 6px; }
.goal .top { display: flex; align-items: center; gap: 12px; }
.goal .name { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
.streak { font-family: var(--font-mono); font-size: 0.78rem; color: var(--sec); background: var(--sec-soft); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.streak.zero { color: var(--muted); background: transparent; border: 1px solid var(--line); }
.week { display: flex; justify-content: space-between; gap: 4px; padding: 0 10px 0 12px; }
.day { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 2px 0; min-width: 36px; }
.day i { font-style: normal; font-family: var(--font-mono); font-size: 0.65rem; color: var(--muted); letter-spacing: 0.06em; }
.day b { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: block; }
.day.on b { background: var(--sec); border-color: var(--sec); }
.day.today i { color: var(--fg); font-weight: 500; }
.day.today b { border-color: var(--muted); }
.day.today.on b { border-color: var(--sec); }

/* Monthly goals */
.monthnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
.monthnav button { width: 44px; height: 44px; border: 0; background: transparent; border-radius: 10px; font-size: 1.4rem; line-height: 1; color: var(--fg); }
.monthnav button:disabled { color: var(--line); }
.monthnav .mid { text-align: center; min-width: 0; }
.monthnav .mlabel { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; }
.mcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 8px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.mtop { display: flex; align-items: center; gap: 8px; }
.mname { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; padding-top: 4px; }
.mcard.done .mname { color: var(--sec); }
.tag { font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--sec); background: var(--sec-soft); border-radius: 999px; padding: 3px 9px; }
.meter { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; margin-right: 6px; }
.meter i { display: block; height: 100%; background: var(--sec); border-radius: 999px; transition: width 0.3s ease; }
.mrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-right: 6px; }
.mnum { font-family: var(--font-mono); font-size: 0.95rem; }
.mnum small { color: var(--muted); font-size: 0.75rem; }
.stepper { display: flex; gap: 8px; }
.stepper button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 1.3rem; line-height: 1; }
.stepper button[data-act="m-inc"] { background: var(--sec); border-color: var(--sec); color: var(--sec-ink); }
.stepper button:disabled { opacity: 0.4; }

/* Challenges */
.chcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 8px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.chtop { display: flex; align-items: flex-start; gap: 8px; }
.chname { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; padding-top: 2px; }
.chstat { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); padding-top: 5px; white-space: nowrap; }
.chcard.complete .chstat { color: var(--sec); }
.chmeta { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-right: 6px; flex-wrap: wrap; }
.cells { display: flex; flex-wrap: wrap; gap: 6px; padding-right: 6px; }
.cell { width: 32px; height: 32px; border-radius: 8px; border: 1.5px solid var(--line); background: transparent; font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); display: grid; place-items: center; padding: 0; }
.cell.on { background: var(--sec); border-color: var(--sec); color: var(--sec-ink); }
.cell.today { border-color: var(--fg); color: var(--fg); }
.cell.today.on { color: var(--sec-ink); }
.cell.future { opacity: 0.45; border-style: dashed; }
.cell.missed { border-style: dashed; }
.chcard .cta { margin-right: 6px; }
.chcard .cta.undo { background: transparent; color: var(--sec); border: 1px solid var(--sec); }
.tpl { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 8px 8px 14px; }
.tpl .tname { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.tpl .tname small { display: block; font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); margin-top: 1px; }
.tpl button { border: 1px solid var(--sec); color: var(--sec); background: transparent; border-radius: 10px; padding: 8px 14px; font-weight: 600; min-height: 40px; }
.tpl button:disabled { border-color: var(--line); color: var(--muted); }

/* Profile */
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.who { display: flex; align-items: center; gap: 14px; }
.avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-weight: 700; font-size: 1.9rem; display: grid; place-items: center; flex: none; }
.who .fields { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.who input { width: 100%; }
.level { display: flex; flex-direction: column; gap: 8px; }
.level .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.level .lv { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; }
.level .meter { margin-right: 0; }
.level.sec-profile { --sec: var(--accent); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.stat b { font-family: var(--font-mono); font-size: 1.5rem; font-weight: 500; display: block; line-height: 1.2; }
.stat span { font-size: 0.82rem; color: var(--muted); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; background: var(--line); border-radius: 12px; }
.seg button { border: 0; background: transparent; padding: 9px 6px; border-radius: 9px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(10, 30, 45, 0.12); }
.prow { display: flex; gap: 8px; flex-wrap: wrap; }
.prow .btn { flex: 1 1 140px; }
.msg { font-size: 0.85rem; color: var(--accent); min-height: 1.2em; }
.pcard h3 { margin: 0; font-size: 0.78rem; font-family: var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }

.empty { text-align: center; color: var(--muted); padding: 24px 12px; border: 1px dashed var(--line); border-radius: 14px; }
.foot { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: var(--muted); gap: 12px; }
.foot button { border: 0; background: transparent; color: var(--accent); font-weight: 600; padding: 6px 0; }
.foot button[disabled] { color: var(--muted); opacity: 0.5; cursor: default; }

/* Bottom navigation */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(6px, env(safe-area-inset-left, 0px)); padding-right: max(6px, env(safe-area-inset-right, 0px));
}
.nav-in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.navbtn { position: relative; border: 0; background: transparent; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 2px 8px; font-size: 0.68rem; font-weight: 500; min-width: 0; }
.navbtn svg { width: 22px; height: 22px; }
.navbtn[data-tab="tasks"] { --c: var(--accent); }
.navbtn[data-tab="daily"] { --c: var(--goal); }
.navbtn[data-tab="monthly"] { --c: var(--month); }
.navbtn[data-tab="challenges"] { --c: var(--chal); }
.navbtn[data-tab="profile"] { --c: var(--fg); }
.navbtn[aria-current="page"] { color: var(--c); }
.navbtn[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--c); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="masthead" id="masthead">
    <div class="when">
      <div class="greet" id="greet"></div>
      <h1 class="weekday" id="weekday">Today</h1>
      <div class="fulldate" id="fulldate"></div>
    </div>
    <div class="ring" aria-live="polite">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="track" cx="50" cy="50" r="42" fill="none" stroke-width="9"></circle>
        <circle class="arc" id="ringBar" cx="50" cy="50" r="42" fill="none" stroke-width="9" stroke-linecap="round" stroke-dasharray="263.9" stroke-dashoffset="263.9"></circle>
      </svg>
      <div class="label"><div><span id="ringNum">0/0</span><small>goals</small></div></div>
    </div>
  </header>

  <div class="note" id="sampleNote" hidden>
    <span>These are sample entries. Delete them or add your own.</span>
    <button type="button" id="clearSamples">Clear samples</button>
  </div>

  <!-- Tasks -->
  <section class="panel sec-tasks on" id="p-tasks" aria-label="Tasks">
    <form class="add" id="taskForm" autocomplete="off">
      <input id="taskInput" type="text" maxlength="140" placeholder="Add a task" aria-label="New task">
      <button type="submit">Add</button>
    </form>
    <div class="filters" id="filters">
      <button type="button" class="chip" data-filter="all" aria-pressed="true">All</button>
      <button type="button" class="chip" data-filter="open" aria-pressed="false">To do</button>
      <button type="button" class="chip" data-filter="done" aria-pressed="false">Done</button>
    </div>
    <ul class="list" id="taskList"></ul>
    <div class="foot"><span id="taskSummary"></span><button type="button" id="clearDone">Clear done</button></div>
  </section>

  <!-- Daily goals -->
  <section class="panel sec-daily" id="p-daily" aria-label="Daily goals">
    <form class="add" id="goalForm" autocomplete="off">
      <input id="goalInput" type="text" maxlength="80" placeholder="New daily goal, e.g. Read 20 pages" aria-label="New daily goal">
      <button type="submit">Add</button>
    </form>
    <div class="stackv" id="goalList"></div>
    <div class="foot"><span>Tap a dot to fix a past day.</span></div>
  </section>

  <!-- Monthly goals -->
  <section class="panel sec-monthly" id="p-monthly" aria-label="Monthly goals">
    <header class="sechead">
      <h1 class="sectitle">Monthly goals</h1>
      <div class="sub">Set a target for the month and add
