<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Daybook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column, phone-first. Masthead with today's date and a goal ring, segmented tabs, then the active list. */
:root {
  --bg: #f2f5f8;
  --surface: #ffffff;
  --fg: #14202b;
  --muted: #5f6f7e;
  --line: #d9e1e8;
  --accent: #1d6e8c;
  --accent-ink: #ffffff;
  --goal: #c4791f;
  --goal-soft: #f6e7d2;
  --done: #8896a3;
  --danger: #b3362f;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f161c; --surface: #17212a; --fg: #e8eef3; --muted: #93a3b1; --line: #263543;
    --accent: #5fb4d1; --accent-ink: #0b1a22; --goal: #e8a653; --goal-soft: #3a2c16;
    --done: #6b7b89; --danger: #ef7a72; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f161c; --surface: #17212a; --fg: #e8eef3; --muted: #93a3b1; --line: #263543;
  --accent: #5fb4d1; --accent-ink: #0b1a22; --goal: #e8a653; --goal-soft: #3a2c16;
  --done: #6b7b89; --danger: #ef7a72; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.masthead { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 6px; }
.masthead .when { min-width: 0; }
.weekday { font-family: var(--font-display); font-weight: 700; font-size: 2.4rem; line-height: 1; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.fulldate { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); margin-top: 8px; letter-spacing: 0.02em; }
.ring { position: relative; width: 84px; height: 84px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { stroke: var(--line); }
.ring .bar { stroke: var(--goal); transition: stroke-dashoffset 0.4s ease; }
.ring .label { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-family: var(--font-mono); font-size: 0.95rem; font-weight: 500; line-height: 1.1; }
.ring .label small { display: block; font-size: 0.62rem; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; }

.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--line); border-radius: 12px; }
.tab { border: 0; background: transparent; padding: 10px 8px; border-radius: 9px; font-weight: 600; color: var(--muted); display: flex; justify-content: center; align-items: baseline; gap: 8px; }
.tab .count { font-family: var(--font-mono); font-size: 0.75rem; font-weight: 400; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(10, 30, 45, 0.12); }

.add { display: flex; gap: 8px; }
.add input { flex: 1; min-width: 0; padding: 13px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.add input::placeholder { color: var(--muted); }
.add button { border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; padding: 0 18px; border-radius: 12px; }
.goals-view .add button { background: var(--goal); color: #fff; }

.note { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 0.85rem; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 10px 12px; }
.note button { border: 0; background: transparent; color: var(--accent); font-weight: 600; padding: 4px; }

.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 12px; font-size: 0.85rem; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px 6px 6px 8px; }
.check { width: 44px; height: 44px; flex: none; border: 0; background: transparent; display: grid; place-items: center; }
.check span { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--muted); display: grid; place-items: center; transition: background 0.15s, border-color 0.15s; }
.check span svg { width: 14px; height: 14px; opacity: 0; stroke: var(--accent-ink); }
.item.done .check span { background: var(--accent); border-color: var(--accent); }
.item.done .check span svg { opacity: 1; }
.item .title { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.item.done .title { color: var(--done); text-decoration: line-through; text-decoration-thickness: 1px; }
.item .meta { font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); display: block; margin-top: 2px; }
.del { border: 0; background: transparent; color: var(--muted); width: 44px; height: 44px; border-radius: 10px; font-size: 1.3rem; line-height: 1; flex: none; }
.del:hover, .del.armed { color: var(--danger); }
.del.armed { font-size: 0.8rem; font-weight: 600; width: auto; padding: 0 10px; }

.goal { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 8px 12px 8px; display: flex; flex-direction: column; gap: 6px; }
.goal .top { display: flex; align-items: center; gap: 12px; }
.goal .name { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
.goal.done .check span { background: var(--goal); border-color: var(--goal); }
.goal.done .check span svg { opacity: 1; }
.streak { font-family: var(--font-mono); font-size: 0.8rem; color: var(--goal); background: var(--goal-soft); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.streak.zero { color: var(--muted); background: transparent; border: 1px solid var(--line); }
.week { display: flex; justify-content: space-between; gap: 4px; padding: 0 10px 0 12px; }
.day { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 2px 0; min-width: 36px; }
.day i { font-style: normal; font-family: var(--font-mono); font-size: 0.65rem; color: var(--muted); letter-spacing: 0.06em; }
.day b { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: block; }
.day.on b { background: var(--goal); border-color: var(--goal); }
.day.today i { color: var(--fg); font-weight: 500; }
.day.today b { border-color: var(--muted); }
.day.today.on b { border-color: var(--goal); }

.empty { text-align: center; color: var(--muted); padding: 28px 12px; border: 1px dashed var(--line); border-radius: 14px; }
.foot { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: var(--muted); gap: 12px; }
.foot button { border: 0; background: transparent; color: var(--accent); font-weight: 600; padding: 6px 0; }
.foot button[disabled] { color: var(--muted); opacity: 0.5; cursor: default; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="masthead">
    <div class="when">
      <h1 class="weekday" id="weekday">Today</h1>
      <div class="fulldate" id="fulldate"></div>
    </div>
    <div class="ring" aria-live="polite">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="track" cx="50" cy="50" r="42" fill="none" stroke-width="9"></circle>
        <circle class="bar" id="ringBar" cx="50" cy="50" r="42" fill="none" stroke-width="9" stroke-linecap="round" stroke-dasharray="263.9" stroke-dashoffset="263.9"></circle>
      </svg>
      <div class="label"><div><span id="ringNum">0/0</span><small>goals</small></div></div>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tabTasks" data-tab="tasks" aria-selected="true">Tasks <span class="count" id="countTasks"></span></button>
    <button class="tab" role="tab" id="tabGoals" data-tab="goals" aria-selected="false">Daily goals <span class="count" id="countGoals"></span></button>
  </div>

  <div class="note" id="sampleNote" hidden>
    <span>These are sample entries. Delete them or add your own.</span>
    <button type="button" id="clearSamples">Clear samples</button>
  </div>

  <section id="tasksView" aria-labelledby="tabTasks" style="display:flex;flex-direction:column;gap:14px">
    <form class="add" id="taskForm" autocomplete="off">
      <input id="taskInput" type="text" maxlength="140" placeholder="Add a task" aria-label="New task">
      <button type="submit">Add</button>
    </form>
    <div class="filters" id="filters">
      <button type="button" class="chip" data-filter="all" aria-pressed="true">All</button>
      <button type="button" class="chip" data-filter="open" aria-pressed="false">To do</button>
      <button type="button" class="chip" data-filter="done" aria-pressed="false">Done</button>
    </div>
    <ul class="list" id="taskList"></ul>
    <div class="foot"><span id="taskSummary"></span><button type="button" id="clearDone">Clear done</button></div>
  </section>

  <section id="goalsView" class="goals-view" aria-labelledby="tabGoals" style="display:none;flex-direction:column;gap:14px">
    <form class="add" id="goalForm" autocomplete="off">
      <input id="goalInput" type="text" maxlength="80" placeholder="New daily goal, e.g. Read 20 pages" aria-label="New daily goal">
      <button type="submit">Add</button>
    </form>
    <div class="list" id="goalList"></div>
    <div class="foot"><span>Tap a dot to fix a past day.</span></div>
  </section>
</div>

<script>
(function () {
  var KEY = "daybook-v1";
  var CIRC = 263.9;
  var state = { tasks: [], goals: [], samples: false, tab: "tasks", filter: "all" };
  var armed = null;

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function keyOf(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function todayKey() { return keyOf(new Date()); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  var $ = function (id) { return document.getElementById(id); };

  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function load() {
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) {}
    if (raw) {
      try {
        var s = JSON.parse(raw);
        if (s && Array.isArray(s.tasks) && Array.isArray(s.goals)) {
          state.tasks = s.tasks; state.goals = s.goals; state.samples = !!s.samples;
          state.tab = s.tab === "goals" ? "goals" : "tasks";
          return;
        }
      } catch (e) {}
    }
    seed();
  }
  function seed() {
    var t = new Date();
    function back(n) { var d = new Date(); d.setDate(d.getDate() - n); return keyOf(d); }
    state.tasks = [
      { id: uid(), title: "Reply to the landlord about the lease", done: false, createdAt: t.getTime() },
      { id: uid(), title: "Buy groceries: rice, lentils, onions", done: false, createdAt: t.getTime() - 1000 },
      { id: uid(), title: "Pay the electricity bill", done: true, createdAt: t.getTime() - 2000 }
    ];
    state.goals = [
      { id: uid(), title: "Walk 30 minutes", days: [back(3), back(2), back(1)] },
      { id: uid(), title: "Read 20 pages", days: [back(1)] },
      { id: uid(), title: "Drink 8 glasses of water", days: [] }
    ];
    state.samples = true;
    save();
  }

  function streak(g) {
    var set = {}; g.days.forEach(function (k) { set[k] = 1; });
    var d = new Date(), n = 0;
    if (!set[keyOf(d)]) d.setDate(d.getDate() - 1);
    while (set[keyOf(d)]) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  function isDone(g, k) { return g.days.indexOf(k) !== -1; }

  var CHECK = '<svg viewBox="0 0 14 14" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7.5l3 3 6-7"/></svg>';

  function renderHead() {
    var now = new Date();
    $("weekday").textContent = now.toLocaleDateString(undefined, { weekday: "long" });
    $("fulldate").textContent = now.toLocaleDateString(undefined, { day: "numeric", month: "long", year: "numeric" });
    var tk = todayKey(), total = state.goals.length;
    var done = state.goals.filter(function (g) { return isDone(g, tk); }).length;
    $("ringNum").textContent = done + "/" + total;
    $("ringBar").style.strokeDashoffset = String(CIRC * (1 - (total ? done / total : 0)));
  }

  function renderTabs() {
    var tasksOpen = state.tasks.filter(function (t) { return !t.done; }).length;
    $("countTasks").textContent = tasksOpen ? String(tasksOpen) : "";
    $("countGoals").textContent = state.goals.length ? String(state.goals.length) : "";
    ["tasks", "goals"].forEach(function (t) {
      $("tab" + (t === "tasks" ? "Tasks" : "Goals")).setAttribute("aria-selected", String(state.tab === t));
    });
    $("tasksView").style.display = state.tab === "tasks" ? "flex" : "none";
    $("goalsView").style.display = state.tab === "goals" ? "flex" : "none";
    $("sampleNote").hidden = !state.samples;
  }

  function renderTasks() {
    var f = state.filter;
    document.querySelectorAll("#filters .chip").forEach(function (c) { c.setAttribute("aria-pressed", String(c.dataset.filter === f)); });
    var list = state.tasks.filter(function (t) { return f === "all" || (f === "open" ? !t.done : t.done); });
    var html = list.map(function (t) {
      var a = armed === "t" + t.id;
      return '<li class="item' + (t.done ? " done" : "") + '" data-id="' + t.id + '">' +
        '<button class="check" data-act="toggle-task" aria-label="' + (t.done ? "Mark as not done" : "Mark as done") + '"><span>' + CHECK + '</span></button>' +
        '<div class="title">' + esc(t.title) + '</div>' +
        '<button class="del' + (a ? " armed" : "") + '" data-act="del-task" aria-label="Delete task">' + (a ? "Delete?" : "&times;") + '</button></li>';
    }).join("");
    $("taskList").innerHTML = html || '<li class="empty">' + (state.tasks.length ? "Nothing here with this filter." : "No tasks yet. Add the first one above.") + '</li>';
    var open = state.tasks.filter(function (t) { return !t.done; }).length;
    var doneN = state.tasks.length - open;
    $("taskSummary").textContent = open + " to do, " + doneN + " done";
    $("clearDone").disabled = doneN === 0;
  }

  function renderGoals() {
    var tk = todayKey();
    var html = state.goals.map(function (g) {
      var s = streak(g), today = isDone(g, tk), a = armed === "g" + g.id;
      var dots = "";
      for (var i = 6; i >= 0; i--) {
        var d = new Date(); d.setDate(d.getDate() - i);
        var k = keyOf(d), on = isDone(g, k);
        dots += '<button class="day' + (on ? " on" : "") + (i === 0 ? " today" : "") + '" data-act="toggle-day" data-day="' + k + '" aria-pressed="' + on + '" aria-label="' + esc(d.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "short" })) + '">' +
          '<i>' + d.toLocaleDateString("en-US", { weekday: "short" }).slice(0, 2).toUpperCase() + '</i><b></b></button>';
      }
      return '<div class="goal' + (today ? " done" : "") + '" data-id="' + g.id + '">' +
        '<div class="top"><button class="check" data-act="toggle-day" data-day="' + tk + '" aria-label="' + (today ? "Undo today" : "Done for today") + '"><span>' + CHECK + '</span></button>' +
        '<div class="name">' + esc(g.title) + '</div>' +
        '<span class="streak' + (s ? "" : " zero") + '">' + s + (s === 1 ? " day" : " days") + '</span>' +
        '<button class="del' + (a ? " armed" : "") + '" data-act="del-goal" aria-label="Delete goal">' + (a ? "Delete?" : "&times;") + '</button></div>' +
        '<div class="week">' + dots + '</div></div>';
    }).join("");
    $("goalList").innerHTML = html || '<div class="empty">No goals yet. Add one habit you want to keep every day.</div>';
  }

  function render() { renderHead(); renderTabs(); renderTasks(); renderGoals(); }
  function touch() { state.samples = state.samples && false; save(); }

  $("taskForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = $("taskInput").value.trim();
    if (!v) { $("taskInput").focus(); return; }
    state.tasks.unshift({ id: uid(), title: v, done: false, createdAt: Date.now() });
    $("taskInput").value = "";
    save(); render();
  });
  $("goalForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = $("goalInput").value.trim();
    if (!v) { $("goalInput").focus(); return; }
    state.goals.push({ id: uid(), title: v, days: [] });
    $("goalInput").value = "";
    save(); render();
  });

  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act], [data-tab], [data-filter]");
    if (!el) { if (armed) { armed = null; render(); } return; }
    if (el.dataset.tab) { state.tab = el.dataset.tab; armed = null; save(); render(); return; }
    if (el.dataset.filter) { state.filter = el.dataset.filter; render(); return; }
    var row = el.closest("[data-id]"), id = row && row.dataset.id, act = el.dataset.act;
    if (act === "toggle-task") {
      var t = state.tasks.find(function (x) { return x.id === id; });
      if (t) t.done = !t.done;
      save(); render();
    } else if (act === "del-task") {
      if (armed === "t" + id) { state.tasks = state.tasks.filter(function (x) { return x.id !== id; }); armed = null; }
      else armed = "t" + id;
      save(); render();
    } else if (act === "toggle-day") {
      var g = state.goals.find(function (x) { return x.id === id; });
      if (g) {
        var k = el.dataset.day, i = g.days.indexOf(k);
        if (i === -1) g.days.push(k); else g.days.splice(i, 1);
      }
      save(); render();
    } else if (act === "del-goal") {
      if (armed === "g" + id) { state.goals = state.goals.filter(function (x) { return x.id !== id; }); armed = null; }
      else armed = "g" + id;
      save(); render();
    }
  });

  $("clearDone").addEventListener("click", function () {
    state.tasks = state.tasks.filter(function (t) { return !t.done; });
    save(); render();
  });
  $("clearSamples").addEventListener("click", function () {
    state.tasks = []; state.goals = []; state.samples = false;
    save(); render();
  });

  // Any edit by the person ends the sample state.
  ["taskForm", "goalForm"].forEach(function (id) {
    $(id).addEventListener("submit", function () { state.samples = false; save(); renderTabs(); });
  });

  var lastDay = todayKey();
  function checkDay() { if (todayKey() !== lastDay) { lastDay = todayKey(); render(); } }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) checkDay(); });
  setInterval(checkDay, 60000);

  load();
  render();
})();
</script>

</body></html>
